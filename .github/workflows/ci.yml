name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "src/package-lock.json"

      - name: Install dependencies
        working-directory: ./src
        run: npm ci

      - name: Run Linter
        working-directory: ./src
        run: npm run lint

      - name: Run Tests
        working-directory: ./src
        run: npm run test:ci
